[package]
name = "klippelgo-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Shared Rust core for the KlippelGo iOS and Android apps: gossip, map packs, routes and trip proofs, money and chain settings."

[workspace]
members = ["bench", "proofs", "verify"]

# Debug and test builds keep line numbers for this workspace's own code, so backtraces still point at a line,
# and no debug info for dependencies: full debug info made target/ several times larger and nothing here
# steps through libp2p in a debugger. `make clean-core` empties target/ when it is no longer needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
chacha20poly1305 = "0.10"
klippelgo-proofs = { path = "proofs", features = ["search"] }
klippelgo-verify = { path = "verify" }
futures = "0.3"
getrandom = "0.2"
libp2p = { version = "0.57", features = ["gossipsub", "macros", "noise", "ping", "tcp", "tokio", "yamux"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# Generates the Kotlin and Swift bindings from the built library (see apps/android/chain/build.gradle.kts).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# Bootstrap node that phones dial to find each other (`make gossip-node`).
[[bin]]
name = "klippelgo-node"
path = "src/bin/node.rs"
