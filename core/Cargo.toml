[package]
name = "klippelgo-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Shared Rust core for the KlippelGo iOS and Android apps: gossip, map packs, routes and trip proofs, money and chain settings."

[workspace]
members = ["proofs", "verify"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
klippelgo-proofs = { path = "proofs", features = ["search"] }
klippelgo-verify = { path = "verify" }
futures = "0.3"
libp2p = { version = "0.57", features = ["gossipsub", "macros", "noise", "ping", "tcp", "tokio", "yamux"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# Generates the Kotlin and Swift bindings from the built library (see apps/android/chain/build.gradle.kts).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# Bootstrap node that phones dial to find each other (`make gossip-node`).
[[bin]]
name = "klippelgo-node"
path = "src/bin/node.rs"
