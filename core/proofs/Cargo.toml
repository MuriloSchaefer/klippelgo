[package]
name = "klippelgo-proofs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Map packs on disk, Valhalla results turned into checkable paths, and ride evidence as files. The part of KlippelGo's trip proofs that needs a file system; the checks themselves are in klippelgo-verify."

[features]
# Address search inside a map pack. Brings in SQLite, which a juror's tool does not need.
search = ["dep:rusqlite"]

[dependencies]
klippelgo-verify = { path = "../verify" }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa", "sha256"] }

# What a juror runs on the evidence of a disputed ride.
[[bin]]
name = "klippelgo-juror"
path = "src/bin/juror.rs"
